name: Bug Report
description: Report a bug or issue with this plugin
labels: ["bug"]
assignees:
  - mybezo
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for reporting a bug in DynaTech!
        Please fill in the form below so the problem can be reproduced and fixed quickly.

        <strong><i>Fields marked with an asterisk (*) are required</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Before reporting, please confirm that
      options:
        - label: You are using a version downloaded from [GitHub Releases](https://github.com/mybezo/DynaTech/releases) or [GitHub Actions](https://github.com/mybezo/DynaTech/actions)
          required: true
        - label: You have not modified the contents of the downloaded file in any way
          required: true
        - label: You have searched the [list of known issues](https://github.com/mybezo/DynaTech/issues) and did not find the same issue
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the issue you are reporting in detail.
        Detailed information helps us resolve the issue faster.
      placeholder: Just saying "it doesn't work" won't help the developers find the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Describe in detail how to reproduce the issue.
        If you have a video, please provide a link to it here.
      placeholder: |
        1. xxx
        2. xxx
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: |
        What did you expect to happen?
        Sometimes an issue is caused by a misunderstanding of a feature.
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: Server Log
      description: |
        Check whether the server log contains any errors. If it does, upload it to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the log directly here**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: Error Report
      description: |
        If the server log mentions a file in `/plugins/Slimefun/error-reports` (an error report),
        upload it to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the error report directly here**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `/sf versions` in game and screenshot or paste the **full output** of the command here.
        If the command doesn't work, please manually provide your server software, server Minecraft version, Slimefun version, this plugin's version and your plugin list.
        If the Minecraft version of your server differs from the client version you use to connect, please mention that as well.
      placeholder: |
        (Paste the full output of /sf versions here, or fill it in manually)
    validations:
      required: true
